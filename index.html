<title>GRAVAITUBE PRO</title>
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFF; --row:#F5F6F8; --row2:#EEF0F4; --line:#E3E6EC;
  --txt:#323338; --mut:#676879; --blue:#579BFC; --navy:#1F4E8C;
  --acc:#FF9800; --acc2:#FFCC80; --ok:#00C875; --bad:#E2445C; --warn:#FDAB3D; --dark:#333333;
  --r:12px; --fs:14.5px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Figtree,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:var(--fs);line-height:1.45}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace}
body.dev-tablet{--fs:15px}
body.dev-pc{--fs:14.5px}

/* Cabeçalho + abas */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:1280px;margin:0 auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.hrow h1{font-size:18px}
.hrow h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.hbtn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
img.logo{background:none;object-fit:cover}
.inst-logo{width:96px;height:96px;border-radius:22px;display:block;margin:4px auto 10px;box-shadow:0 6px 18px rgba(242,85,44,.35)}
.passo{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.passo b.n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.big-cta{width:100%;padding:16px;font-size:17px}
body.standalone #btnInstalar{display:none}
/* Estúdio: câmera + teleprompter */
body.no-scroll{overflow:hidden}
.nova-versao{position:fixed;left:12px;right:12px;bottom:84px;z-index:150;background:#323338;color:#fff;border-radius:12px;padding:10px 14px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px #0004}
.pre{white-space:pre-wrap;background:#F5F6F8;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:280px;overflow:auto}
.ra-it{align-items:flex-start;flex-wrap:wrap}.ra-it .grow{flex:1 1 calc(100% - 40px);min-width:0}.ra-bt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;padding-left:34px}
.ed-hist{display:flex;gap:6px;margin-left:auto;margin-right:8px}
.toast button{color:#323338}
#studio{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:none;overflow:hidden;font-family:inherit}
#studio.on{display:block}
.st-top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#202124;position:relative;z-index:5}
.st-top-flutua{position:absolute;top:0;left:0;right:0;background:linear-gradient(#000c,#0000)}
.st-tit{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
.st-ic{background:#ffffff1f;border:0;color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none;cursor:pointer}
.st-ic:disabled{opacity:.35}
.st-escolha{padding:20px 16px;max-width:720px;margin:0 auto}
.st-escolha p{color:#bbb;margin:6px 0 14px;font-size:16px}
.st-op{display:flex;gap:14px;align-items:center;background:#1c1c1e;border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer}
.st-op b{font-size:40px}.st-op h3{color:#fff;margin:0 0 4px}.st-op span{color:#aaa;font-size:14px}
.st-stage{position:absolute;inset:0;bottom:150px;overflow:hidden;background:#000}
#stVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#111}
.com-cam #stVideo{display:block}
.st-texto{position:absolute;left:0;right:0;top:0;bottom:0;display:none;--op:.55}
.com-texto .st-texto{display:block}
.modo-tele.com-texto .st-texto{background:#000}
.modo-tele.com-cam.pip-fundo .st-texto{background:rgba(0,0,0,var(--op))}
.modo-tele.com-cam.pip-canto #stVideo{inset:auto;right:12px;bottom:12px;width:30%;height:auto;aspect-ratio:9/16;max-height:45%;border-radius:12px;border:2px solid #fff6;z-index:4}
.modo-camera.com-texto .st-texto{background:rgba(0,0,0,var(--op))}
.modo-camera.com-texto.pos-topo .st-texto{bottom:auto;height:42%}
.modo-camera.com-texto.pos-meio .st-texto{top:29%;bottom:auto;height:42%}
.modo-camera.com-texto.pos-baixo .st-texto{top:auto;height:42%}
.st-scroll{position:absolute;inset:0;overflow:hidden}
.st-conteudo{margin:0 auto;padding:0 4%;color:#fff;font-weight:500;will-change:transform}
.st-conteudo p{margin:0 0 .8em}.st-vazio{color:#999;font-size:20px}
.st-foco{position:absolute;left:0;right:0;height:0;border-top:2px dashed #FF980080;z-index:2;pointer-events:none}
.st-foco::before{content:'▶';position:absolute;left:4px;top:-13px;color:#FF9800;font-size:16px}
.st-rec{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#E2445C;color:#fff;font-weight:800;padding:4px 12px;border-radius:20px;display:none;z-index:6}
.st-rec.on{display:block;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.55}}
.st-conta{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#fff;background:#0006;z-index:7}
.st-conta.on{display:flex}
.st-bar{position:absolute;left:0;right:0;bottom:0;height:150px;background:#2b2b2e;padding:8px 14px;z-index:5}
.st-prog{display:flex;align-items:center;gap:10px;font-size:13px;color:#ccc}
.st-prog input{flex:1;accent-color:#2196F3}
.st-ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:4px}
.st-play{width:60px;height:60px;border-radius:50%;border:3px solid #fff;background:none;color:#fff;font-size:24px;cursor:pointer}
.st-tog{background:#ffffff14;border:1px solid #555;color:#fff;border-radius:12px;padding:4px 10px;font-size:20px;display:flex;flex-direction:column;align-items:center;min-width:92px;cursor:pointer}
.st-tog small{font-size:11px;color:#bbb}.st-tog.on{border-color:#FF9800;background:#FF980033}.st-tog.on small{color:#FFCC80}
.st-ctrl2{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;color:#bbb}
.st-recbtn{display:flex;align-items:center;gap:8px;background:#E2445C;border:0;color:#fff;font-weight:800;border-radius:22px;padding:8px 18px;cursor:pointer}
.st-recbtn i{width:14px;height:14px;border-radius:50%;background:#fff}.st-recbtn.on i{border-radius:2px}
.st-recbtn:disabled{background:#555;color:#999}
.st-sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:#fff;color:#323338;border-radius:18px 18px 0 0;padding:16px;z-index:9;display:none}
.st-sheet.on{display:block}
.st-l{display:flex;justify-content:space-between;font-size:14px;color:#676879;margin:12px 0 4px}
.st-sheet input[type=range]{width:100%;accent-color:#FF9800}
.st-sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.st-sw small{display:block;color:#888}.st-sw input{width:22px;height:22px}
.st-lista{max-height:240px;overflow:auto;border:1px solid #eee;border-radius:10px}
.st-item{display:flex;gap:10px;padding:10px;border-bottom:1px solid #f0f0f0;cursor:pointer}.st-item small{display:block;color:#888}
.st-result video{width:100%;max-height:50vh;background:#000;border-radius:12px}
.st-aviso{display:flex;gap:10px;align-items:center}
.tempo-box{margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.parte-n{display:inline-flex;width:22px;height:22px;border-radius:6px;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:6px}
.btn.gravar{background:#E2445C;border-color:#E2445C;color:#fff;font-weight:800}

.tile .big{font-size:34px;font-weight:800;line-height:1}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.4px;opacity:.95;font-weight:700}
.tile .side{text-align:right;font-size:12px;line-height:1.5}
.tile .ic{font-size:34px}
.badge-up{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--ok);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}
.badge-dn{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--bad);align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-left:4px}

/* Listas */
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}
.it .m{font-size:12px;color:var(--mut)}
.it .grow{flex:1;min-width:0}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.col{flex:0 0 84%;max-width:310px;background:var(--row);border-radius:12px;min-height:220px;overflow:hidden}
body.dev-pc .col,body.dev-tablet .col{flex:1 1 0;max-width:none;min-width:200px}
.col h3{font-size:14px;display:flex;justify-content:space-between;margin:0;padding:9px 11px;color:#fff}
.col .cb{padding:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.kc .t{font-size:13px;font-weight:600}
.kc .m{font-size:11px;color:var(--mut);margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.kc .mv{display:flex;justify-content:space-between;margin-top:7px}
.kc .mv button{background:var(--row);border:1px solid var(--line);border-radius:6px;padding:2px 12px;cursor:pointer}
.col.drop{outline:2px dashed var(--acc)}

/* Calendário estilo Swonkie / Magnific */
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding:4px 0;font-weight:700;text-transform:uppercase}
.cal .d{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:64px;padding:4px;cursor:pointer;overflow:hidden}
.cal .d.out{background:transparent;border-style:dashed;opacity:.5}
.cal .d.hoje{border:2px solid var(--acc)}
.cal .d.sel{background:#FFF6F1}
.cal .d .n{font-size:12px;font-weight:700;margin-bottom:2px}
.cal .d .n i{display:inline-block;background:var(--ok);color:#fff;border-radius:3px;padding:0 4px;font-style:normal}
.mini{border-radius:4px;margin-top:3px;overflow:hidden;background:var(--row);font-size:10px;line-height:1.25}
.mini .s{color:#fff;font-weight:700;padding:1px 4px;text-transform:uppercase;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .x{padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:10px;color:var(--mut);margin-top:2px}
body.dev-celular .mini .x{display:none}
body.dev-celular .mini .s{font-size:0;height:5px;padding:0}
body.dev-pc .cal .d{min-height:110px}
.wk{display:grid;grid-template-columns:1fr;gap:10px}
body.dev-pc .wk,body.dev-tablet .wk{grid-template-columns:repeat(7,minmax(0,1fr))}
.wkd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
.wkd .dh{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.wcard{border-radius:6px;overflow:hidden;margin-bottom:6px;cursor:pointer;border:1px solid var(--line)}
.wcard .s{color:#fff;font-weight:700;padding:4px 8px;font-size:12px;text-align:center}
.wcard .b{padding:6px 8px;font-size:12px;background:var(--surface)}
.wcard .b b{font-weight:700}

/* Grade 30 dias (SlideKit) */
.g30{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
body.dev-celular .g30{grid-template-columns:repeat(2,1fr)}
.g30 .gc{border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.g30 .gc .gh{color:#fff;font-weight:800;font-size:22px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.g30 .gc .gh small{font-size:11px;font-weight:600;opacity:.9}
.g30 .gc .gb{padding:8px 10px;font-size:12px;min-height:58px}
.g30 .gc.hoje{outline:3px solid var(--acc)}

/* Semestre (SlideTeam) */
.sem .mh2{background:var(--acc);color:#fff;font-weight:800;padding:8px 12px;border-radius:8px 8px 0 0}
.sem .mb{background:#FFF5EE;border:1px solid #FFD9C6;border-top:0;border-radius:0 0 8px 8px;padding:10px 12px;margin-bottom:12px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(30,30,40,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:760px){.ov{align-items:center}.modal{border-radius:16px}}
.modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.modal .mh h2{font-size:19px}
.modal .mh .x{margin-left:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.panel-n{display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--acc);color:#fff;font-weight:800;font-size:13px;align-items:center;justify-content:center;margin-right:6px}
.bar{height:10px;background:var(--row2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.score{font-size:40px;font-weight:800}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td,.spec th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.spec th{font-size:12px;color:var(--mut)}
.counter{font-size:12px;font-weight:700;text-align:right;margin-top:3px}
.counter.over{color:var(--bad)}
.imv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.devs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dev{border:2px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;background:var(--surface)}
.dev b{display:block;font-size:30px}
.dev.on{border-color:var(--acc);background:#FFF1EA}

/* ===== Identidade v3.9.1: cores e layout da Marca & Estratégia ===== */
:root{ --bg:#F3F9FF; --surface:#FFFFFF; --row:#F4F9FE; --row2:#E9F4FC; --line:#DCEBF7; --txt:#14233D; --mut:#5D6E86;
  --blue:#2196F3; --sky:#2196F3; --sky2:#1976D2; --navy:#001637; --acc:#FF9800; --acc2:#FFB74D; --r:16px; }
html,body{background:radial-gradient(900px 340px at -8% -6%, rgba(0,169,252,.16), transparent 62%), radial-gradient(720px 300px at 108% 2%, rgba(85,219,254,.16), transparent 60%), var(--bg);background-attachment:fixed}
h1,h2,h3,.grp-h,.tabs button,.btn,.title-row h2,.mh h2,.tile .big{font-family:Poppins,Figtree,Roboto,"Segoe UI",system-ui,sans-serif}
h1,h2{color:var(--navy);font-weight:800;letter-spacing:-.15px}
h3{color:var(--navy)}
header.top{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hrow h1{line-height:1.05}
.hrow h1 .marca{font-family:"Baloo 2",Poppins,system-ui,sans-serif;font-weight:800;font-size:1.32em;letter-spacing:.2px;color:#2196F3;background:linear-gradient(180deg,#42A5F5,#2196F3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hrow h1 .pro{color:#FF9800;font-family:Poppins,system-ui,sans-serif;font-weight:800;font-size:.95em;white-space:nowrap}
.hrow h1 small{margin-top:3px}
img.logo{width:40px;height:40px;border-radius:11px;box-shadow:0 4px 12px rgba(33,150,243,.35)}
.tabs{background:linear-gradient(120deg,#16BBFF 0%,#00A6FA 45%,#1976D2 100%);box-shadow:0 6px 18px rgba(33,150,243,.32)}
.tabs button{color:rgba(255,255,255,.95);font-weight:600}
.tabs button:hover{background:rgba(255,255,255,.16)}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700;box-shadow:0 4px 14px rgba(0,22,55,.20)}
.tabs .tsep{background:rgba(255,255,255,.4)}
.tseta{color:var(--sky2)}
.card{border-radius:18px;border:1px solid #E2EEF9;box-shadow:0 6px 20px rgba(0,110,200,.07)}
.card h2,.title-row h2{color:var(--navy)}
.btn{border-radius:12px;border-color:#D4E6F6;font-weight:600}
.btn:hover{border-color:var(--sky)}
.btn.acc{background:linear-gradient(135deg,#FF7A1A,#FF9800);border:0;border-radius:999px;color:#fff;box-shadow:0 6px 16px rgba(254,81,1,.28);padding-left:18px;padding-right:18px}
.btn.acc:hover{filter:brightness(1.05)}
.btn.hh{border-radius:999px}
.fab{background:linear-gradient(135deg,#FF7A1A,#FF9800);box-shadow:0 8px 22px rgba(254,81,1,.42)}
.chip{border-color:#D4E6F6}
.chip.on{border-color:var(--acc);background:#FFF1E8;color:#C8410A}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],input[type=url],select,textarea{border-radius:12px;border-color:#D4E6F6}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,169,252,.18)}
.nnum{color:#0267C1;background:#E3F4FF}
.inst-logo{box-shadow:0 8px 22px rgba(33,150,243,.38)}
.passo b.n{background:linear-gradient(135deg,#16BBFF,#1976D2)}
table.mt td.nm{border-radius:10px 0 0 10px}
table.mt td:last-child{border-radius:0 10px 10px 0}

function abrirDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains('conteudos')) d.createObjectStore('conteudos', {keyPath:'id'});
      if(!d.objectStoreNames.contains('imoveis')) d.createObjectStore('imoveis', {keyPath:'id'});
      if(!d.objectStoreNames.contains('config')) d.createObjectStore('config', {keyPath:'k'});
    };
    r.onsuccess = function(){ db = r.result; res(); };
    r.onerror = function(){ rej(r.error); };
  });
}
function lerTudo(store){
  return new Promise(function(res, rej){
    var q = db.transaction(store, 'readonly').objectStore(store).getAll();
    q.onsuccess = function(){ res(q.result || []); };
    q.onerror = function(){ rej(q.error); };
  });
}
// todas as requisições disparadas de forma síncrona na mesma transação
function gravar(store, itens){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); var st = tx.objectStore(store);
    itens.forEach(function(i){ st.put(i); });
    tx.oncomplete = function(){ res(); };
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error); };
  });
}
function apagar(store, id){
  return new Promise(function(res, rej){
    var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id);
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); };
  });
}

function prepararInstalacao(){

var PALAVRAS_POR_SEG = 2.5; /* ~150 palavras por minuto, fala natural em português */
var TEMPO_FORMATO = {

  'Vídeo curto':{min:15, max:60, txt:'Vídeo curto: 15 a 60 s'},

  'Post':{min:0, max:0, txt:'Post: texto de leitura, sem tempo de fala'},
  'Carrossel':{min:0, max:0, txt:'Carrossel: 1 ideia por cartão, leitura rápida'},
  'Documento':{min:0, max:0, txt:'Documento: leitura'},
  'Post GMN':{min:0, max:0, txt:'Post no Google: 150 a 300 palavras'},

function contarPalavras(t){ return (String(t||'').match(/[\wÀ-ÿ]+/g)||[]).length; }

function infoTempo(texto, formato){

}
function htmlTempo(texto, formato){
  var i = infoTempo(texto, formato);
  var cor = {ok:'#00C875', curto:'#FDAB3D', longo:'#E2445C', vazio:'#9AA0AA'}[i.status] || '#676879';
  var msg = {ok:'✔ dentro do tempo sugerido', curto:'⚠ texto curto: complete o texto falado', longo:'⚠ passou do tempo sugerido: corte ou divida', vazio:'escreva o texto completo'}[i.status] || '';

function tituloLimpo(t){ return String(t||'').replace(/^[^\wÀ-ÿ]*/,'').replace(/^\d{1,2}\/\d{1,2}\s*\|\s*[^|]*\|\s*/,'').replace(/^(DOM|SEG|TER|QUA|QUI|SEX|SÁB|SAB)\s*\|\s*/i,'').replace(/^(🎬|📌|🎠|📸|🎥)\s*/,'').trim(); }
var ROTULO_RE = /(CART[ÃA]O|STORY|SLIDE)\s*(\d+|FINAL|\(capa\))?\s*(\([^)]*\))?\s*:\s*/gi;
function limparRotulos(t){ return String(t||'').replace(ROTULO_RE,'').replace(/\|\s*/g,' ').replace(/\s+/g,' ').trim(); }
function semNotas(t){ return String(t||'').replace(/\n*[ \t]*Como (gravar|produzir):[\s\S]*$/i,'').trim(); }
function montarDescricao(c){
  var p = perfil(c.perfil), rot = semNotas(c.roteiro), partes = [], cta = (c.cta || p.cta || '').trim();

  var gancho = (c.gancho||'').trim();
  if(/BLOCO \d/.test(rot)){
    var topicos = []; rot.replace(/BLOCO \d+\s*[—-]\s*([^(\n]+?)\s*\(/g, function(m, t){ topicos.push('• '+t.trim().charAt(0)+t.trim().slice(1).toLowerCase()); return m; });
    partes.push(gancho || tituloLimpo(c.titulo)); if(topicos.length) partes.push('Neste vídeo:\n'+topicos.join('\n'));

  (lista||S.conteudos).forEach(function(c){
    var rf = reformDe(c); if(!rf || !ehEsboco(c)) return;
    var antigo = c.roteiro, legAuto = !String(c.legenda||'').trim() || (c.historico||[]).some(function(h){ return /montadas automaticamente/.test(h.txt); });
    if(antigo) registrar(c, 'Esboço original guardado: '+antigo);
    var tv = (String(antigo||'').match(/V1\s+([^.]+)/)||[])[1]; if(tv && !String(c.tema||'').trim()) c.tema = tv.trim();
    c.roteiro = rf.r; if(!String(c.gancho||'').trim()) c.gancho = rf.g;
    if(legAuto) c.legenda = montarDescricao(c);
    registrar(c, 'Texto completo reformulado pelo assistente (revise antes de gravar)'); mud.push(c);
  });
  return gravar('conteudos', mud).then(function(){ return mud.length; });
}

function importarDoClaude(txt){
  var blocos = String(txt||'').split(/###\s*CONTE[ÚU]DO/i).slice(1), novos = [], pares = [], troca = null;
  var campo = function(b, nome){ var m = b.match(new RegExp('^\\s*'+nome+'\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*(Perfil|Data|Formato|T[íi]tulo|Gancho|Texto|Descri[çc][ãa]o|Hashtags|CTA|Objetivo|Assunto)\\s*:|$)', 'im')); return m ? m[1].trim() : ''; };
  blocos.forEach(function(b){
    var k = campo(b,'Perfil').replace(/^@/,''), pf = (S.cfg.perfis||[]).filter(function(p){ return p.k===k || p.arroba.replace(/^@/,'')===k; })[0];
    var c = novoConteudo({perfil:pf?pf.k:(UI.clPerfil||'imoveis'), etapa:'Produção', titulo:campo(b,'T[íi]tulo'), gancho:campo(b,'Gancho'), roteiro:campo(b,'Texto'), legenda:campo(b,'Descri[çc][ãa]o'), hashtags:campo(b,'Hashtags'), cta:campo(b,'CTA'), objetivo:campo(b,'Objetivo'), assunto:campo(b,'Assunto'), formato:campo(b,'Formato')||'Reel'});
    if(!c.titulo || !c.roteiro) return;
    c.tema = c.titulo; c.rede = perfil(c.perfil).rede || redeDe(c); if(FORMATOS.indexOf(c.formato)<0) c.formato = 'Reel';
    var d = campo(b,'Data'); if(/^\d{4}-\d{2}-\d{2}$/.test(d) && d>=hoje()){ c.data = d; c.hora = slotDe(c).hora; } else { var sl = slotLivre393(c); c.data = sl.data; c.hora = sl.hora; }
    if(!c.legenda) c.legenda = montarDescricao(c); if(!c.hashtags) c.hashtags = hashtagsDe(c);
    registrar(c, 'Criado pelo Claude (coordenador-editorial-360) e importado no Coordenador.'); novos.push(c); pares.push([null, c]); S.conteudos.push(c);
  });
  if(!novos.length) return Promise.resolve(0);
  numerar39(); registrarLote(pares, 'conteúdos do Claude ('+novos.length+')');
  return gravar('conteudos', novos).then(function(){ return novos.length; });
}

  } else {

function cartaoDia(k, lst){

function lacunas(pk){
  var out = [], h = hoje();
  for(var i=0;i<7;i++){
    var d = addDias(h,i), w = dow(d), precisa = [];
    if(S.cfg.cadencia[w]) precisa.push(S.cfg.cadencia[w]);

    precisa.forEach(function(f){
      var tem = S.conteudos.some(function(c){ return c.perfil===pk && c.data===d && (c.formato===f || (f!=='YouTube' && c.formato!=='YouTube' && c.formato!=='Story')); });
      if(!tem) out.push({data:d, formato:f});
    });
  }
  return out;
}

function dadosRede(r){ return S.conteudos.filter(function(c){ return redeDe(c)===r; }); }
function insights(r){
  var pubs = dadosRede(r).filter(function(c){ return c.etapa==='Publicado' && taxaEng(c)!==null; });
  var out = {n:pubs.length};
  if(!pubs.length) return out;
  out.media = pubs.reduce(function(a,c){ return a+taxaEng(c); },0)/pubs.length;
  function agrupa(fn){ var g={}; pubs.forEach(function(c){ var k=fn(c); if(k==null||k==='') return; (g[k]=g[k]||[]).push(taxaEng(c)); }); return Object.keys(g).filter(function(k){ return g[k].length>=2; }).map(function(k){ return {k:k, n:g[k].length, m:g[k].reduce(function(a,b){return a+b;},0)/g[k].length}; }).sort(function(a,b){ return b.m-a.m; }); }
  out.dias = agrupa(function(c){ return c.data ? DIAS_L[dow(c.data)] : null; });
  out.horas = agrupa(function(c){ if(!c.hora) return null; var h=+c.hora.split(':')[0]; return h<9?'Manhã cedo (até 9h)':h<12?'Manhã (9h–12h)':h<14?'Almoço (12h–14h)':h<18?'Tarde (14h–18h)':h<21?'Noite (18h–21h)':'Noite tarde (21h+)'; });
  out.formatos = agrupa(function(c){ return c.formato; });
  out.perfis = agrupa(function(c){ return perfil(c.perfil).arroba; });
  out.top = pubs.slice().sort(function(a,b){ return taxaEng(b)-taxaEng(a); }).slice(0,5);
  out.leads = pubs.reduce(function(a,c){ return a+num((c.metricas||{}).leads); },0);
  return out;
}
function auditoria(r){
  var cs = dadosRede(r), h = hoje();
  var pub30 = cs.filter(function(c){ return c.etapa==='Publicado' && c.data>addDias(h,-30) && c.data<=h; });
  var semanas = 0; for(var w=0; w<4; w++){ var ini=addDias(h,-7*(w+1)), fim=addDias(h,-7*w); if(cs.some(function(c){ return c.etapa==='Publicado' && c.data>ini && c.data<=fim; })) semanas++; }
  var pubs = cs.filter(function(c){ return c.etapa==='Publicado'; });
  var comMet = pubs.filter(function(c){ return taxaEng(c)!==null; }).length;
  var comCta = cs.filter(function(c){ return c.cta && c.cta.trim(); }).length;
  var comLink = pubs.filter(function(c){ return c.link; }).length;
  var meta = r==='Google' ? 4 : r==='YouTube' ? 8 : 12;
  var auto = [
    ['freq', 'Frequência: '+pub30.length+' publicações em 30 dias (meta '+meta+')', pub30.length>=meta, 'Planeje pelo menos '+Math.ceil(meta/4)+' publicações por semana nesta rede. Use “Gerar mês pelo modelo” em Ajustes → 5.'],
    ['consist', 'Constância: publicou em '+semanas+' das últimas 4 semanas', semanas>=4, 'Não deixe semana vazia: o algoritmo favorece contas constantes.'],
    ['medicao', 'Medição: '+comMet+' de '+pubs.length+' publicados com números', pubs.length>0 && comMet/pubs.length>=0.7, 'Registre alcance e interações 48 h depois de publicar (ficha do conteúdo → Resultados).'],
    ['cta', 'Chamada para ação: '+comCta+' de '+cs.length+' conteúdos', cs.length>0 && comCta/cs.length>=0.8, 'Todo conteúdo deve terminar com uma única próxima ação.'],
    ['link', 'Links salvos: '+comLink+' de '+pubs.length+' publicados', pubs.length>0 && comLink/pubs.length>=0.8, 'Cole o link publicado para acompanhar e reaproveitar.']
  ];
  var man = (AUDIT_MANUAL[r]||[]).map(function(x){ var ok = !!((S.cfg.auditoria[r]||{})[x[0]]); return [x[0], x[1], ok, 'Ajuste: '+x[1].toLowerCase()+'.', true]; });
  var todos = auto.concat(man), ok = todos.filter(function(x){ return x[2]; }).length;
  return {itens:todos, nota: todos.length ? Math.round(ok/todos.length*100) : 0};
}

function gerarMesModelo(pk){

function parseCSV(txt){

    var ch = txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel += ch; }
    else {
      if(ch==='"') q = true;
      else if(ch===sep){ row.push(cel); cel=''; }
      else if(ch==='\n'){ row.push(cel); rows.push(row); row=[]; cel=''; }
      else if(ch==='\r'){ }
      else cel += ch;
    }
  }
  if(cel!=='' || row.length){ row.push(cel); rows.push(row); }
  if(!rows.length) return [];

function lerZip(buf){
  var dv = new DataView(buf), eocd = -1;
  for(var i = buf.byteLength-22; i >= Math.max(0, buf.byteLength-65557); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd = i; break; } }

  if(dv.getUint32(eocd+16,true)===0xFFFFFFFF || dv.getUint16(eocd+10,true)===0xFFFF) return Promise.reject(new Error('Exportação grande demais (ZIP64). Exporte só o banco Conteúdo 360° ou extraia o ZIP e envie o arquivo .csv.'));
  var total = dv.getUint16(eocd+10,true), off = dv.getUint32(eocd+16,true), itens = [];
  for(var k=0;k<total;k++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    var metodo = dv.getUint16(off+10,true), tam = dv.getUint32(off+20,true), nl = dv.getUint16(off+28,true), el = dv.getUint16(off+30,true), cl = dv.getUint16(off+32,true), lho = dv.getUint32(off+42,true);
    var nome = new TextDecoder().decode(new Uint8Array(buf, off+46, nl));
    off += 46+nl+el+cl;
    var ini = lho + 30 + dv.getUint16(lho+26,true) + dv.getUint16(lho+28,true);
    itens.push({nome:nome, metodo:metodo, dados:new Uint8Array(buf, ini, tam)});
  }
  return Promise.all(itens.map(function(it){
    if(it.metodo===0) return Promise.resolve({nome:it.nome, bytes:it.dados});
    if(it.metodo===8){
      if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('Este navegador não abre ZIP. Extraia e envie o CSV.'));
      return new Response(new Blob([it.dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(b){ return {nome:it.nome, bytes:new Uint8Array(b)}; });
    }
    return Promise.resolve(null);
  })).then(function(r){ return r.filter(Boolean); });

function csvsDeArquivo(nome, buf){
  if(/\.zip$/i.test(nome)){
    return lerZip(buf).then(function(arqs){
      return Promise.all(arqs.map(function(a){
        if(/\.zip$/i.test(a.nome)) return csvsDeArquivo(a.nome, a.bytes.slice().buffer);
        if(/\.csv$/i.test(a.nome)) return [{nome:a.nome, txt:new TextDecoder().decode(a.bytes)}];
        return [];
      })).then(function(l){ return [].concat.apply([], l); });
    });
  }
  if(!/\.(csv|txt)$/i.test(nome) && !/^\uFEFF?[^\n]*,/.test(new TextDecoder().decode(new Uint8Array(buf).slice(0,400)))) return Promise.resolve([]);
  return Promise.resolve([{nome:nome, txt:new TextDecoder().decode(new Uint8Array(buf))}]);
}
function importarArquivos(files){
  var msgs = [];

    return p.then(function(){ return f.arrayBuffer(); }).then(function(buf){ return csvsDeArquivo(f.name, buf); }).then(function(csvs){
      if(/\.json$/i.test(f.name)){ msgs.push('"'+f.name+'" é um backup do app: use Ajustes → Restaurar backup.'); return; }
      if(!csvs.length){ msgs.push('"'+f.name+'": não encontrei planilha CSV dentro. No Notion, exporte o banco escolhendo o formato "Markdown e CSV" (não HTML nem PDF).'); return; }

function restaurar(txt){
  var d;
  try{ d = JSON.parse(txt); }catch(e){ return Promise.reject(new Error('Este arquivo não é um backup do app (.json). Para trazer os dados do Notion, use o botão “Carregar meus conteúdos do Notion” no Painel ou em Ajustes → 6.')); }
  if(!d || d.app!=='SOCIAL_IMOB_360_PRO' || !Array.isArray(d.conteudos) || !Array.isArray(d.imoveis) || typeof d.config!=='object') return Promise.reject(new Error('Backup incompatível'));
  if(d.conteudos.some(function(c){ return !c || !c.id; }) || d.imoveis.some(function(m){ return !m || !m.id; })) return Promise.reject(new Error('Backup com registros sem identificação'));
  var camps = Array.isArray(d.campanhas) ? d.campanhas : [];
  return new Promise(function(res, rej){
    var tx = db.transaction(['conteudos','imoveis','config'], 'readwrite');
    var a = tx.objectStore('conteudos'), b = tx.objectStore('imoveis'), c = tx.objectStore('config');
    a.clear(); b.clear(); c.clear();
    d.conteudos.forEach(function(x){ a.put(x); }); d.imoveis.forEach(function(x){ b.put(x); }); c.put({k:'main', v:d.config}); c.put({k:'campanhas', v:camps});
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; tx.onabort = function(){ rej(tx.error || new Error('Restauração cancelada')); };
  }).then(carregar);
}

function comBordao(txt, b){
  if(!b || temBordao(txt, b)) return txt;
  var linhas = String(txt||'').split('\n'), i = linhas.length;
  for(var j=0;j<linhas.length;j++){ if(/^\s*(Como (gravar|produzir|postar)|Depois:|COMO POSTAR)/i.test(linhas[j])){ i = j; break; } }

function cliSlots(semanas, desde){
  /* Regra 360: até 5 Reels (vídeos), 2 posts de autoridade e 1 carrossel por semana, nos dias que a pessoa escolheu */
  var d = S.cfg.cli, dias = (d.dias||CLI_DIAS_PADRAO).slice().sort(function(a,b){ return ((a+6)%7)-((b+6)%7); }), nv = Math.min(d.videos==null?5:+d.videos, dias.length);
  var vdias = [], pdias = [], cdia = dias.indexOf(6)>=0 ? 6 : dias[dias.length-1];
  if(nv){ var passo = dias.length / nv; for(var i=0;i<nv;i++) vdias.push(dias[Math.floor(i*passo)]); }
  var prefP = [2,4].filter(function(x){ return dias.indexOf(x)>=0 && x!==cdia; });
  dias.forEach(function(x){ if(prefP.length<2 && prefP.indexOf(x)<0 && x!==cdia && vdias.indexOf(x)<0) prefP.push(x); });
  dias.forEach(function(x){ if(prefP.length<2 && prefP.indexOf(x)<0 && x!==cdia) prefP.push(x); });
  pdias = prefP.slice(0,2);
  var out = [], ini = desde || addDias(hoje(), 1);
  for(var k=0; k<semanas*7; k++){ var dt = addDias(ini, k), w = dow(dt);
    if(vdias.indexOf(w)>=0) out.push({data:dt, tipo:'video'});
    if(pdias.indexOf(w)>=0) out.push({data:dt, tipo:'post'});
    if(w===cdia && dias.length) out.push({data:dt, tipo:'carrossel'});
  }
  return out;
}

/* ---------- sessão e licença ---------- */
function entrou(r){
  ls("token", r.token); ls("conta", r.conta);
  if(MODO === "portal"){ fechar(); document.dispatchEvent(new CustomEvent("central:entrou", {detail:r})); return; }
  conferir(true);
}
function liberar(r){
  ls("ok", {quando:Date.now(), licenca:r.licenca || null}); fechar(); botao();
  document.dispatchEvent(new CustomEvent("central:liberado", {detail:r}));
}
function conferir(forcar){
  var t = ls("token");
  if(!t) return telaEntrar();
  var ultimo = ls("ok");
  if(!forcar && ultimo && Date.now() - ultimo.quando < RECHECAR){ botao(); return; }
  api({acao:"acesso", token:t, app:APPID}).then(function(r){
    if(!r.ok){ ls("token", null); ls("ok", null); return telaEntrar(["info", r.mensagem || "Entre de novo."]); }
    if(r.conta) ls("conta", r.conta);
    if(r.liberado) return liberar(r);
    ls("ok", null); telaSemAcesso(r.licenca || {});
  }).catch(function(){
    if(ultimo && Date.now() - ultimo.quando < TOLERANCIA_OFFLINE){ botao(); return; }
    telaEntrar(["erro", "Sem internet para conferir seu acesso. Conecte-se e tente de novo."]);
  });
}
function sair(){
  var t = ls("token"); if(t) api({acao:"sair", token:t}).catch(function(){});
  ls("token", null); ls("ok", null); ls("conta", null);
  var b = document.getElementById("ca-botao"); if(b) b.remove();
  if(MODO === "portal"){ document.dispatchEvent(new CustomEvent("central:saiu")); return; }
  telaEntrar();
}

/* ---------- menu Minha conta ---------- */

  if(MODO === "portal" || document.getElementById("ca-botao")) return;
  var b = document.createElement("button"); b.id = "ca-botao"; b.type = "button"; b.textContent = "Minha conta"; b.onclick = menu;

}

  mostrar(caixa("Minha conta", esc(c.nome || "") + (c.email ? "<br><small>" + esc(c.email) + "</small>" : ""),
    portal + '<button class="ca-sec" id="ca-sup">Pedir suporte</button>' + (CFG.backup ? '<button class="ca-sec" id="ca-bk">Cópia de segurança</button>' : '') + (CFG.ponte ? '<button class="ca-sec" id="ca-ponte">Trazer meus dados do endereço antigo</button>' : '') +
    '<button class="ca-sec" id="ca-sair">Sair</button><button class="ca-link" id="ca-fechar">Fechar</button>', pe()));
  document.getElementById("ca-fechar").onclick = fechar;

function listarApps(caixaApps){
  if(!caixaApps) return;
  api({acao:"meusApps", token:ls("token")}).then(function(r){
    var outros = (r.apps || []).filter(function(a){ return a.url && a.app !== APPID; });
    if(!r.ok || !outros.length){ caixaApps.innerHTML = CFG.portal ? '<a class="ca-sec" style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:10px" href="' + esc(CFG.portal) + '" target="_blank" rel="noopener">Ver todos os apps</a>' : ""; return; }
    caixaApps.innerHTML = '<small style="color:#667;font-weight:600">Abrir outro app (sem digitar a senha de novo)</small>' + outros.map(function(a){
      return '<button class="ca-sec" data-app="' + esc(a.app) + '" data-url="' + esc(a.url) + '"' + (a.liberado ? '' : ' style="opacity:.7"') + '>' + esc(a.nome) + (a.liberado ? '' : ' • ' + esc(a.status)) + '</button>';
    }).join("");
    [].forEach.call(caixaApps.querySelectorAll("button[data-app]"), function(b){ b.onclick = function(){ abrirApp(b.dataset.url, b.dataset.app); }; });
  }).catch(function(){ caixaApps.innerHTML = ""; });
}

/* ---------- entrar uma vez só: passe de uso único para abrir outro app ---------- */
function abrirApp(url, app){
  var janela = window.open("about:blank", "_blank");
  var ir = function(destino){ if(janela){ try{ janela.opener = null; }catch(e){} janela.location.href = destino; } else location.href = destino; };
  var t = ls("token");
  if(!t || !CFG.url) return ir(url);
  api({acao:"passe", token:t, app:app}).then(function(r){
    ir(r.ok && r.passe ? url.split("#")[0] + "#ca-passe=" + encodeURIComponent(r.passe) : url);
  }).catch(function(){ ir(url); });
}
function lerPasse(){
  var m = String(location.hash || "").match(/ca-passe=([A-Za-z0-9%]+)/);
  if(!m) return "";
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){ location.hash = ""; }
  return decodeURIComponent(m[1]);
}

/* ---------- trazer os dados do endereço antigo (mesmo aparelho) ----------
 * Abre a página-ponte do endereço antigo numa janela; ela lê os dados daquele endereço
 * e manda só para este app (origem conferida dos dois lados). */
function trazerDados(){
  if(!CFG.ponte) return;
  if(!confirmar("Trazer os dados que ficaram no endereço antigo deste app, neste aparelho?\n\nOs dados atuais deste app neste aparelho serão substituídos pelos do endereço antigo.")) return;
  var origemPonte = new URL(CFG.ponte.url).origin;
  var w = window.open(CFG.ponte.url + "?app=" + encodeURIComponent(CFG.ponte.app) + "&para=" + encodeURIComponent(location.origin), "ca-ponte", "width=420,height=520");
  if(!w){ alert("O navegador bloqueou a janela. Permita pop-ups para este site e tente de novo."); return; }
  var tempo = setTimeout(function(){ window.removeEventListener("message", ouvir); }, 120000);
  function ouvir(e){
    if(e.origin !== origemPonte || !e.data || e.data.tipo !== "ponte-dados" || e.data.app !== CFG.ponte.app) return;
    window.removeEventListener("message", ouvir); clearTimeout(tempo);
    gravarDadosPonte(e.data).then(function(n){
      try{ w.postMessage({tipo:"ponte-ok", n:n}, origemPonte); }catch(x){}
      alert(n ? "Pronto! " + n + " itens trazidos do endereço antigo. O app vai recarregar." : "Não encontrei dados deste app no endereço antigo neste aparelho. Se você usava em outro celular ou computador, faça isto lá.");
      if(n) location.reload();
    }).catch(function(err){ alert("Não consegui gravar os dados: " + (err && err.message || err)); });
  }
  window.addEventListener("message", ouvir);
}
function gravarDadosPonte(d){
  var n = 0, pref = (CFG.ponte.prefixos || []);
  var trazidos = {};
  Object.keys(d.ls || {}).forEach(function(k){ if(pref.some(function(p){ return k.indexOf(p) === 0; })){ localStorage.setItem(k, d.ls[k]); trazidos[k] = d.ls[k]; n++; } });
  // o app pode salvar o estado atual ao recarregar (pagehide): regrava o que veio por último
  var regravar = function(){ Object.keys(trazidos).forEach(function(k){ try{ localStorage.setItem(k, trazidos[k]); }catch(e){} }); };
  window.addEventListener("pagehide", regravar); window.addEventListener("beforeunload", regravar);
  var bancos = (d.idb || []).filter(function(b){ return (CFG.ponte.idb || []).indexOf(b.nome) >= 0; });
  return bancos.reduce(function(prom, b){ return prom.then(function(){ return gravarBanco(b).then(function(q){ n += q; }); }); }, Promise.resolve()).then(function(){ return n; });
}
function gravarBanco(b){
  return new Promise(function(ok, falha){
    var existe = indexedDB.databases ? indexedDB.databases().then(function(l){ return l.some(function(x){ return x.name === b.nome; }); }) : Promise.resolve(true);
    existe.then(function(sim){
      var req = sim ? indexedDB.open(b.nome) : indexedDB.open(b.nome, b.versao || 1);
      req.onupgradeneeded = function(){
        var db = req.result;
        b.lojas.forEach(function(l){
          if(db.objectStoreNames.contains(l.nome)) return;
          var os = db.createObjectStore(l.nome, {keyPath:l.keyPath || undefined, autoIncrement:!!l.autoIncrement});
          (l.indices || []).forEach(function(ix){ try{ os.createIndex(ix.nome, ix.keyPath, {unique:!!ix.unique, multiEntry:!!ix.multiEntry}); }catch(e){} });
        });
      };
      req.onerror = function(){ falha(req.error); };
      req.onsuccess = function(){
        var db = req.result, nomes = b.lojas.map(function(l){ return l.nome; }).filter(function(x){ return db.objectStoreNames.contains(x); });
        if(!nomes.length){ db.close(); return ok(0); }
        var tx = db.transaction(nomes, "readwrite"), q = 0;
        b.lojas.forEach(function(l){
          if(nomes.indexOf(l.nome) < 0) return;
          var os = tx.objectStore(l.nome); os.clear();
          l.registros.forEach(function(r){ if(os.keyPath) os.put(r.v); else os.put(r.v, r.k); q++; });
        });
        tx.oncomplete = function(){ db.close(); ok(q); };
        tx.onerror = function(){ db.close(); falha(tx.error); };
      };
    }).catch(falha);
  });
}
function telaSuporte(){
  mostrar(caixa("Pedir suporte", "Descreva o que aconteceu. A resposta chega no seu e-mail.",
    '<form id="ca-f"><label for="ca-txt">Mensagem</label><textarea id="ca-txt" rows="5" maxlength="2000" required></textarea><button class="ca-pri" id="ca-b">Enviar</button></form><button class="ca-link" id="ca-fechar">Fechar</button>'), "#ca-txt");
  document.getElementById("ca-fechar").onclick = fechar;
  document.getElementById("ca-f").onsubmit = function(e){
    e.preventDefault(); var b = document.getElementById("ca-b"); ocupado(b, true);
    api({acao:"chamado", token:ls("token"), app:APPID, tipo:"suporte", mensagem:v("ca-txt")}).then(function(r){ ocupado(b, false); msg(r.ok ? "ok" : "erro", r.mensagem); }).catch(function(){ falhaRede(b); });
  };
}

/* ---------- cópia de segurança (dados do aparelho) ---------- */
function chavesDoApp(){
  var pref = (CFG.backup && CFG.backup.prefixos) || [], out = {};
  for(var i = 0; i < localStorage.length; i++){
    var k = localStorage.key(i);
    if(pref.some(function(p){ return k.indexOf(p) === 0; })) out[k] = localStorage.getItem(k);
  }
  return out;
}
function baixarBackup(){
  var dados = {app:APPID, nome:CFG.nome, gerado:new Date().toISOString(), origem:location.origin + location.pathname, chaves:chavesDoApp()};
  var blob = new Blob([JSON.stringify(dados)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = (CFG.app || "app") + "-copia-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  ls("backup", Date.now());
}
function restaurarBackup(){
  var i = document.createElement("input"); i.type = "file"; i.accept = ".json,application/json";
  i.onchange = function(){
    var f = i.files[0]; if(!f) return;
    f.text().then(function(t){
      var d = JSON.parse(t);
      if(!d || !d.chaves || (d.app && d.app !== CFG.app)) throw new Error("arquivo");
      var n = Object.keys(d.chaves).length;
      if(!confirmar("Restaurar " + n + " registros da cópia de " + String(d.gerado || "").slice(0, 10) + "? Os dados atuais deste aparelho serão substituídos.")) return;
      var pref = (CFG.backup && CFG.backup.prefixos) || [];
      Object.keys(d.chaves).forEach(function(k){ if(pref.some(function(p){ return k.indexOf(p) === 0; })) localStorage.setItem(k, d.chaves[k]); });
      location.reload();
    }).catch(function(){ faixaTexto("Este arquivo não é uma cópia válida deste app."); });
  };
  i.click();
}
function confirmar(t){ try{ return window.confirm(t); }catch(e){ return true; } }
function faixaTexto(t){ var f = document.getElementById("ca-faixa"); if(f) f.querySelector("span").textContent = t; }
function faixaBackup(forcar){
  if(!CFG.backup || document.getElementById("ca-faixa")) return;
  var dias = CFG.backup.dias || 7, ultimo = ls("backup"), adiado = ls("backup_adiado");
  if(!forcar){
    if(!Object.keys(chavesDoApp()).length) return;
    if(ultimo && Date.now() - ultimo < dias * 864e5) return;
    if(adiado && Date.now() - adiado < 864e5) return;
  }
  var f = document.createElement("div"); f.id = "ca-faixa"; f.setAttribute("role", "region"); f.setAttribute("aria-label", "Cópia de segurança");
  f.innerHTML = '<strong>Cópia de segurança</strong><br><span>' + (ultimo ? "Sua última cópia foi em " + new Date(ultimo).toLocaleDateString("pt-BR") + "." : "Você ainda não fez cópia dos dados deste aparelho.") +
    " Os dados ficam só neste aparelho: baixe uma cópia e guarde no Drive ou no e-mail.</span><br>" +
    '<button type="button" id="ca-bk-baixar">Baixar cópia agora</button><button type="button" id="ca-bk-rest">Restaurar cópia</button><button type="button" class="ca-depois" id="ca-bk-dep">Lembrar amanhã</button>';
  document.body.appendChild(f);
  document.getElementById("ca-bk-baixar").onclick = function(){ baixarBackup(); f.remove(); };
  document.getElementById("ca-bk-rest").onclick = restaurarBackup;
  document.getElementById("ca-bk-dep").onclick = function(){ ls("backup_adiado", Date.now()); f.remove(); };
}

/* ---------- início ---------- */
window.CentralAcesso = {
  api: function(d){ if(ls("token") && !d.token) d.token = ls("token"); return api(d); },
  entrar: telaEntrar, cadastrar: telaCadastro, esqueci: telaEsqueci, sair: sair, fechar: fechar,
  conta: function(){ return ls("conta"); }, token: function(){ return ls("token"); },
  baixarBackup: baixarBackup, restaurarBackup: restaurarBackup, configurado: !!CFG.url, versao: "1.1.0", abrirApp: abrirApp, trazerDados: trazerDados
};
function iniciar(){
  var passe = CFG.url ? lerPasse() : "";
  if(passe){
    api({acao:"usarPasse", passe:passe, app:APPID}).then(function(r){
      if(r.ok && r.token){ ls("ok", null); entrou(r); if(MODO !== "portal") setTimeout(function(){ faixaBackup(false); }, 4000); }
      else if(MODO !== "portal") conferir(false);
    }).catch(function(){ if(MODO !== "portal") conferir(false); });
    return;
  }
  if(MODO === "portal") return;
  setTimeout(function(){ faixaBackup(false); }, 4000);
  if(!CFG.url) return; // Central ainda não implantada: o app segue funcionando como antes
  conferir(false);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar); else iniciar();
})();
